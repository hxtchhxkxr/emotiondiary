spring:
  application:
    name: emotiondiary

  profiles:
    active: local

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 3

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 정적 리소스 캐시 설정
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 30d
          cache-public: true

      # 콘텐츠 기반 리소스 버전 관리
      chain:
        strategy:
          content:
            enabled: true
            paths: /**

# HTML, CSS, JS 등의 응답 압축
server:
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
    min-response-size: 1KB

jwt:
  member:
    secret: ${JWT_MEMBER_SECRET}
    access-exp-min: 30
    refresh-exp-min: 1440

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: when-authorized

  metrics:
    tags:
      application: emotiondiary

    distribution:
      # http.server.requests의 히스토그램 버킷 생성
      percentiles-histogram:
        http.server.requests: true

      # 서버에서 미리 계산할 백분위
      percentiles:
        http.server.requests: 0.5,0.95,0.99

      # 응답시간 버킷 경계
      sla:
        http.server.requests: 10ms,50ms,100ms,200ms,500ms,1s,2s